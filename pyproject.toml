[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "porch-alert"
version = "0.1.0"
description = "Raspberry Pi porch alert — motion, person detection, email"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "tflite-runtime>=2.14; platform_machine == 'aarch64'",
    "gpiozero>=2.0",
    "RPi.GPIO>=0.7",
    "picamera2>=0.3; platform_machine == 'aarch64'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
porch-alert = "porch_alert.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
